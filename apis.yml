aid: hami
name: HAMi
description: >-
  HAMi (Heterogeneous AI Computing Virtualization Middleware) is a CNCF incubating open-source project
  that brings device sharing, memory and core isolation, and topology-aware scheduling to heterogeneous
  AI accelerators on Kubernetes. It lets several containers share one physical GPU or NPU with hard
  memory limits and enforced compute quotas, across NVIDIA, Huawei Ascend, Cambricon MLU, Hygon DCU,
  Enflame GCU, Iluvatar, Moore Threads, MetaX, Kunlunxin and Vastai devices. HAMi ships a scheduler, a
  device plugin, an in-container enforcement library (HAMi-core/libvgpu), a DRA driver, and HAMi WebUI —
  an observability dashboard whose backend exposes a gRPC and grpc-gateway REST API over cluster GPU,
  node, workload and Prometheus-backed monitoring data. The project also publishes a machine-readable
  discovery surface on its documentation site: an RFC 9727 API catalog, an OpenAPI 3.1 service
  description, an Agent Skills discovery index, and Content-Signal directives in robots.txt.
