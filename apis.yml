apis:
  - name: HAMi WebUI API
    description: >-
      The HAMi WebUI backend API. Four gRPC services — Card, Node, Container and Monitor — expose
      cluster accelerator inventory, node inventory, GPU-consuming workloads and Prometheus-backed
      range/instant/summary queries. Every RPC carries a google.api.http annotation, so the same
      surface is served as REST through grpc-gateway under /v1 (for example POST /v1/gpus,
      GET /v1/node, POST /v1/monitor/query/range-vector). The contract is the .proto set published in
      the HAMi-WebUI repository and mirrored verbatim into grpc/ here.
    humanURL: https://project-hami.io/docs/installation/webui-installation
    baseURL: http://{hami-webui-host}:8000
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/hami.png
    tags:
      - GPU Virtualization
      - Kubernetes
      - Observability
      - Monitoring
    properties:
      - type: Protobuf
        url: grpc/hami-webui-card.proto
      - type: Protobuf
        url: grpc/hami-webui-node.proto
      - type: Protobuf
        url: grpc/hami-webui-container.proto
      - type: Protobuf
        url: grpc/hami-webui-monitor.proto
      - type: Protobuf
        url: grpc/hami-webui-error.proto
      - type: SourceCode
        url: https://github.com/Project-HAMi/HAMi-WebUI
      - type: Documentation
        url: https://project-hami.io/docs/installation/webui-installation
  - name: HAMi Website Discovery API
    description: >-
      The machine-readable discovery surface of the HAMi documentation website, described by a
      first-party OpenAPI 3.1.0 document that the site advertises as the service-desc of its RFC 9727
      API catalog. Four anonymous GET endpoints — /robots.txt, /.well-known/api-catalog,
      /.well-known/agent-skills/index.json and /.well-known/site-status.json — let an agent find the
      project's content-usage signals, its API catalog, its published Agent Skills, and site status
      without scraping HTML.
    humanURL: https://project-hami.io/docs/
    baseURL: https://project-hami.io
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/hami.png
    tags:
      - Discovery
