note: >-
  Derived from the contract, not from a docs error reference — HAMi publishes no prose error reference
  page, so titles below are the enum reason names and the remediation column is left empty rather than
  invented. The envelope is NOT RFC 9457 problem+json: the HAMi WebUI backend is a go-kratos service
  whose error extension (errors/errors.proto) attaches a numeric HTTP status to each enum member and
  serializes a JSON body carrying `code`, `reason`, `message` and `metadata`. The numeric codes 521-525
  are non-standard, application-assigned values in the 5xx range and are what the transport actually
  returns.
