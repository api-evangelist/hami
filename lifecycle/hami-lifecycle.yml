  current: 2.10.0
  current_date: '2026-08-21'
  api_versioning: >-
    The HAMi WebUI API paths are prefixed /v1 and the proto package is api.v1; no second API version has
    been published.
  changelog: https://project-hami.io/changelog
support_window:
  source: https://github.com/Project-HAMi/HAMi/blob/master/SECURITY.md
  policy: Security fixes are provided for the three most recent minor releases.
  supported:
