      security_fixes: false
      note: No longer supported.
deprecation:
  policy_published: false
  note: >-
    No standalone deprecation or sunset policy document was found. The supported-versions table in
    SECURITY.md is the only published end-of-support statement, and it is expressed as "no longer
    supported" rather than as a dated deprecation schedule. Individual field-level deprecations do
    exist in the contract — server/internal/conf/conf.proto marks Prometheus.auth `[deprecated = true]`
    with a migration note pointing to `authorization` or `basic_auth` — but that is a code annotation,
    not a policy.
  deprecated_in_contract:
    - field: Prometheus.auth
      file: https://github.com/Project-HAMi/HAMi-WebUI/blob/main/server/internal/conf/conf.proto
      replacement: Prometheus.authorization or Prometheus.basic_auth with credentials mounted from files
status_page:
