note: >-
  HAMi is self-hosted Kubernetes middleware, so its lifecycle is a release lifecycle, not a hosted-API
  lifecycle. There is no public service status page and no Sunset/Deprecation HTTP header surface to
  find, because there is no vendor-run endpoint to run one against — the operator runs the software in
  their own cluster. What the project does publish, and what is recorded here, is a semantic-version
  release train with a dated changelog, an explicit supported-versions window tied to security fixes,
  a public roadmap, and an OpenSSF Security Insights declaration that the repository is active.
versioning:
