note: >-
  NO MCP SERVER IS PUBLISHED BY HAMi. Nothing below is callable today; this is a candidate tool list
  showing what an MCP server over HAMi's existing read-only API surface would expose, and it is pointed
  at from apis.yml as X-MCPServerCandidate rather than MCPServer so it can never be mistaken for a live
  agent surface. Note the direction HAMi has actually taken instead: it publishes Agent Skills (three
  of them — see skills/_index.yml) and an Agent Skills discovery index at
  https://project-hami.io/.well-known/agent-skills/index.json, which is a kubectl/Prometheus-driven
  agent story rather than a hosted-tool one. The one agent integration in the project's own blog,
  kagent (https://project-hami.io/blog/kagent-hami-ai-agent-gpu-virtualization), is third-party and
  drives HAMi through Kubernetes CRDs, not through an MCP endpoint.
