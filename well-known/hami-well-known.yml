source: >-
  Direct HTTP probes of the named /.well-known/ path list (plus /apis.json, /apis.yml, /llms.txt)
  against every host this record knows: the registrable domain project-hami.io, www.project-hami.io,
  and the GitHub Pages host project-hami.github.io that serves the Helm chart repositories.
note: >-
  project-hami.io serves a REAL RFC 9727 API catalog (Content-Type application/linkset+json) that
  declares a service-desc pointing at https://project-hami.io/.well-known/openapi.json — a first-party
  OpenAPI 3.1.0 describing the website's own discovery endpoints — plus a service-doc at /docs and a
  status document at /.well-known/site-status.json. It also serves an RFC 9728 OAuth protected-resource
  document declaring the resource public (empty authorization_servers and scopes_supported). No
  security.txt, no OpenID/OAuth authorization-server metadata, no ai-plugin.json, no UCP/ACP/AAuth
  document, no apis.json and no llms.txt on any host. The site is served by Netlify; every miss below
  returned the Docusaurus 404 HTML page, which is a miss, not a document.
